<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>台北一日遊</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <nav class="navbar">
    <div class="navbar-container">
      <a href="/" class="logo">台北一日遊</a>
      <ul class="navbar-links">
        <a href="#">預定行程</a>
        <a href="#">登入/註冊</a>
      </ul>
    </div>
  </nav>
  
  <div class="hero">
    <div class="hero-container">
      <h1>輕鬆享受台北一日悠閒</h1>
      <p>探索每個角落，體驗城市的深度旅遊行程</p>
      <form class="search-bar">
        <select>
          <option>全部分類</option>
        </select>
        <input type="text" placeholder="輸入景點名稱查詢">
        <button type="submit" class="search-btn">&#128269</button> <!--改用icon-->
      </form>
    </div>
  </div>
  
  <main class="main">

    <section class="attraction-cards">

      <div class="card">
        <div class="card-image">
          <img src="Placeholder Image.png" alt="平安鐘">
          <h3 class="card-title">平安鐘</h3>
        </div>
        <div class="card-info">
          <span>忠孝復興</span>
          <span>公共藝術</span>
        </div>
      </div>

    </section>
  </main>

  <footer class="site-footer">
    <p>COPYRIGHT 2021 台北一日遊</p>
  </footer>

</body>
</html>
