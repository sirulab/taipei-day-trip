<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>台北一日遊</title>
  <link rel="stylesheet" href="/static/style.css">
</head>
<body>

  <nav class="navbar">
    <div class="navbar-container">
      <a href="/" class="logo">台北一日遊</a>
      <ul class="navbar-links">
        <a href="#">預定行程</a>
        <a href="#">登入/註冊</a>
      </ul>
    </div>
  </nav>
  
  <div class="hero">
    <div class="hero-container">
      <h1>輕鬆享受台北一日悠閒</h1>
      <p>探索每個角落，體驗城市的深度旅遊行程</p>
      <form class="search-bar">
        <!--
        <select>
          <option>全部分類</option>
        </select>
        -->
        <div class="category-dropdown">
          <button type="button" class="category-btn" id="category-btn">全部分類 ▼</button>
          <div class="category-popup" id="category-popup" style="display: none;"></div>
        </div>
        <input type="text" placeholder="輸入景點名稱查詢">
        <button type="submit" class="search-btn">&#128269;</button> <!--改用icon-->
      </form>
    </div>
  </div>
  
  <main class="main">

    <section class="mrt-section">
      <button class="mrt-btn">‹</button>
      <div class="mrt-list" id="mrt-list">
        <!--
        <div class="mrt-item">劍潭</div>
        <div class="mrt-item">圓山</div>
        <div class="mrt-item">士林</div>
        <div class="mrt-item">新北投</div>
        <div class="mrt-item">臺大醫院</div>
        <div class="mrt-item">龍山寺</div>
        <div class="mrt-item">西門</div>
        -->
      </div>
      <button class="mrt-btn">›</button>
    </section>

    <section class="attraction-section">
    <!--
      <div class="card">
        <div class="card-image">
          <img src="Placeholder Image.png" alt="平安鐘">
          <h3 class="card-title">平安鐘</h3>
        </div>
        <div class="card-info">
          <span>忠孝復興</span>
          <span>公共藝術</span>
        </div>
      </div>
      -->
    </section>
  </main>

  <footer class="site-footer">
    <p>COPYRIGHT 2021 台北一日遊</p>
  </footer>

  <script>
    const API_URL = '/api/attractions';
    let nextPage = 0;
    let currentCategory = null;
    let currentKeyword = null;

    async function fetchAttractions(isAppend = false) {
      let url = `/api/attractions?page=${nextPage}`;
      if (currentCategory && currentCategory !== '全部分類') {
        url += `&category=${encodeURIComponent(currentCategory)}`;
      }
      if (currentKeyword) {
      url += `&keyword=${encodeURIComponent(currentKeyword)}`;
      }

      const response = await fetch(url);
      const result = await response.json();
      nextPage = result.nextPage;
      renderAttractions(result.data, isAppend);
    }
    
    function renderAttractions(attractions, isAppend = false) {
      const grid = document.querySelector('.attraction-section');
      if (!isAppend) {
        grid.innerHTML = ''; 
      }
      attractions.forEach(site => {
        const firstImage = site.images[0]; 
        const cardHTML = `
          <div class="card">
            <div class="card-image">
              <img src="${firstImage}" alt="${site.name}">
              <h3 class="card-title">${site.name}</h3>
            </div>
            <div class="card-info">
              <span>${site.mrt}</span>
              <span>${site.category}</span>
            </div>
          </div>
        `;
        grid.insertAdjacentHTML('beforeend', cardHTML);
      });
    }

    const observer = new IntersectionObserver((entries) => {
      const footerEntry = entries[0];
      const footer = document.querySelector('.site-footer');
      if (footerEntry.isIntersecting && nextPage !== null) {
        fetchAttractions(true);
      }
        }, { threshold: 0.5 });

    const footer = document.querySelector('.site-footer');
    if (footer) observer.observe(footer);

    fetchAttractions(false);

    const searchForm = document.querySelector('.search-bar');
    const searchInput = searchForm.querySelector('input');
    const categoryBtn = document.getElementById('category-btn');
    const popup = document.getElementById('category-popup');

    const CATEGORY_API_URL = '/api/categories';

    async function fetchCategories() {
        const response = await fetch(CATEGORY_API_URL);
        const result = await response.json();
        renderCategories(result.data);
    }

    function renderCategories(categories) {
      popup.innerHTML = '';

      categories.forEach(catName => {
        const div = document.createElement('div');
        div.className = 'category-item';
        div.textContent = catName;

        div.addEventListener('click', () => {
          categoryBtn.textContent = catName + ' ▼';
          popup.style.display = 'none';
          currentCategory = catName;

          nextPage = 0; 
          fetchAttractions(false);
        });

        popup.appendChild(div);
      });
    }

    searchForm.addEventListener('submit', (e) => {
      e.preventDefault();
      currentKeyword = searchInput.value;
      nextPage = 0;
      fetchAttractions(false);
    });

    fetchCategories();

    document.getElementById('category-btn').addEventListener('click', (event) => {
      event.stopPropagation(); 
      
      const popup = document.getElementById('category-popup');
      if (popup.style.display === 'none') {
        popup.style.display = 'grid';
      } else {
        popup.style.display = 'none';
      }
    });

    window.addEventListener('click', () => {
      const popup = document.getElementById('category-popup');
      if (popup.style.display === 'grid') {
        popup.style.display = 'none';
      }
    });

    const MRT_API_URL = '/api/mrts';

    async function fetchMrts() {
      const response = await fetch(MRT_API_URL);
      
      const result = await response.json();
      renderMrts(result.data);

      const mrtList = document.getElementById('mrt-list');
      const mrtBtns = document.querySelectorAll('.mrt-btn');
      const leftBtn = mrtBtns[0];
      const rightBtn = mrtBtns[1];

    leftBtn.addEventListener('click', () => {
      mrtList.scrollBy({ left: -300, behavior: 'smooth' });
    });

    rightBtn.addEventListener('click', () => {
      mrtList.scrollBy({ left: 300, behavior: 'smooth' });
    });
    }

    function renderMrts(mrtArray) {
      const mrtListContainer = document.getElementById('mrt-list');
      mrtListContainer.innerHTML = '';

      mrtArray.forEach(stationName => {
        // vs. insertAdjacentHTML
        const div = document.createElement('div');
        div.className = 'mrt-item';
        div.textContent = stationName;

        div.addEventListener('click', () => {
        searchInput.value = stationName;
        currentKeyword = stationName;

        nextPage = 0;
        fetchAttractions(false); 
        });
        
        mrtListContainer.appendChild(div);
        });
      }

    fetchMrts();
  </script>
</body>
</html>
