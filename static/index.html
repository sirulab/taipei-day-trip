<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>台北一日遊</title>
  <link rel="stylesheet" href="/static/style.css">
</head>
<body>

  <nav class="navbar">
    <div class="navbar-section">
      <a href="/" class="logo">台北一日遊</a>
      <ul class="navbar-links">
        <a href="#">預定行程</a>
        <button id="nav-auth-btn">登入/註冊</button>
      </ul>
    </div>
  </nav>
  
  <div class="hero">
    <div class="hero-section">
      <h1>輕鬆享受台北一日悠閒</h1>
      <p>探索每個角落，體驗城市的深度旅遊行程</p>
      <form class="search-bar">
        <!--
        <select>
          <option>全部分類</option>
        </select>
        -->
        <div class="category-dropdown">
          <button type="button" class="category-btn" id="category-btn">全部分類 ▼</button>
          <div class="category-popup" id="category-popup" style="display: none;"></div>
        </div>
        <input type="text" placeholder="輸入景點名稱查詢">
        <button type="submit" class="search-btn">
          <!-- <img src="/static/icon/search bar.png" alt="搜尋" style="width: 24px; height: 24px;"> -->
        </button> <!--改用icon-->
      </form>
    </div>
  </div>
  
  <main class="main">

    <section class="mrt-section">
      <button class="mrt-btn" id="left-btn"></button>
      <div class="mrt-list" id="mrt-list">
        <!--
        <div class="mrt-item">劍潭</div>
        <div class="mrt-item">圓山</div>
        <div class="mrt-item">士林</div>
        <div class="mrt-item">新北投</div>
        <div class="mrt-item">臺大醫院</div>
        <div class="mrt-item">龍山寺</div>
        <div class="mrt-item">西門</div>
        -->
      </div>
      <button class="mrt-btn" id="right-btn"></button>
    </section>

    <section class="attraction-section">
    <!--
      <div class="card">
        <div class="card-image">
          <img src="Placeholder Image.png" alt="平安鐘">
          <h3 class="card-title">平安鐘</h3>
        </div>
        <div class="card-info">
          <span>忠孝復興</span>
          <span>公共藝術</span>
        </div>
      </div>
      -->
    </section>
  </main>

  <footer class="site-footer">
    <p>COPYRIGHT 2021 台北一日遊</p>
  </footer>

  <div id="auth-popup" style="display: none;"></div>
  <div id="auth-overlay" style="display: none;"></div>

  <script>
    const API_URL = '/api/attractions';
    let nextPage = 0;
    let currentCategory = null;
    let currentKeyword = null;
    let isLoading = false;

    async function fetchAttractions(isAppend = false) {
      if (isLoading) return;
      isLoading = true;

      let url = `/api/attractions?page=${nextPage}`;
      if (currentCategory && currentCategory !== '全部分類') {
        url += `&category=${encodeURIComponent(currentCategory)}`;
      }
      if (currentKeyword) {
      url += `&keyword=${encodeURIComponent(currentKeyword)}`;
      }
      try {
        const response = await fetch(url);
        const result = await response.json();
        nextPage = result.nextPage;
        renderAttractions(result.data, isAppend);
      } catch (error) {
        console.error('Fetch error:', error);
      } finally {
        isLoading = false; 
      }
    }
    
    function renderAttractions(attractions, isAppend = false) {
      const grid = document.querySelector('.attraction-section');
      if (!isAppend) {
        grid.innerHTML = ''; 
      }
      attractions.forEach(site => {
        const firstImage = site.images[0]; 
        const cardHTML = `
          <div class="card" onclick="window.location.href='/attraction/${site.id}'" style="cursor: pointer;">
            <div class="card-image">
              <img src="${firstImage}" alt="${site.name}">
              <h3 class="card-title">${site.name}</h3>
            </div>
            <div class="card-info">
              <span>${site.mrt}</span>
              <span>${site.category}</span>
            </div>
          </div>
        `;
        grid.insertAdjacentHTML('beforeend', cardHTML);
      });
    }

    const observer = new IntersectionObserver((entries) => {
      const footerEntry = entries[0];
      const footer = document.querySelector('.site-footer');
      if (footerEntry.isIntersecting && nextPage !== null) {
        fetchAttractions(true);
      }
        }, { threshold: 0.5 });

    const footer = document.querySelector('.site-footer');
    if (footer) observer.observe(footer);

    fetchAttractions(false);

    const searchForm = document.querySelector('.search-bar');
    const searchInput = searchForm.querySelector('input');
    const categoryBtn = document.getElementById('category-btn');
    const popup = document.getElementById('category-popup');

    const CATEGORY_API_URL = '/api/categories';

    async function fetchCategories() {
        const response = await fetch(CATEGORY_API_URL);
        const result = await response.json();
        renderCategories(result.data);
    }

    function renderCategories(categories) {
      popup.innerHTML = '';

      categories.forEach(catName => {
        const div = document.createElement('div');
        div.className = 'category-item';
        div.textContent = catName;

        div.addEventListener('click', () => {
          categoryBtn.textContent = catName + ' ▼';
          popup.style.display = 'none';
          currentCategory = catName;
          
          nextPage = 0; 
          fetchAttractions(false);
          
        });

        popup.appendChild(div);
      });
    }

    searchForm.addEventListener('submit', (event) => {
      event.preventDefault();
      currentKeyword = searchInput.value;
      nextPage = 0;
      fetchAttractions(false);
    });

    fetchCategories();

    document.getElementById('category-btn').addEventListener('click', (event) => {
      event.stopPropagation(); 
      
      const popup = document.getElementById('category-popup');
      if (popup.style.display === 'none') {
        popup.style.display = 'grid';
      } else {
        popup.style.display = 'none';
      }
    });

    window.addEventListener('click', () => {
      const popup = document.getElementById('category-popup');
      if (popup.style.display === 'grid') {
        popup.style.display = 'none';
      }
    });

    const MRT_API_URL = '/api/mrts';

    async function fetchMrts() {
      const response = await fetch(MRT_API_URL);
      
      const result = await response.json();
      renderMrts(result.data);

      const mrtList = document.getElementById('mrt-list');
      const mrtBtns = document.querySelectorAll('.mrt-btn');
      const leftBtn = mrtBtns[0];
      const rightBtn = mrtBtns[1];

    leftBtn.addEventListener('click', () => {
      mrtList.scrollBy({ left: -300, behavior: 'smooth' });
    });

    rightBtn.addEventListener('click', () => {
      mrtList.scrollBy({ left: 300, behavior: 'smooth' });
    });
    }

    function renderMrts(mrtArray) {
      const mrtListSection = document.getElementById('mrt-list');
      mrtListSection.innerHTML = '';

      mrtArray.forEach(stationName => {
        // vs. insertAdjacentHTML
        const div = document.createElement('div');
        div.className = 'mrt-item';
        div.textContent = stationName;

        div.addEventListener('click', () => {
        searchInput.value = stationName;
        currentKeyword = stationName;

        nextPage = 0;
        fetchAttractions(false); 
        });
        
        mrtListSection.appendChild(div);
        });
      }

    fetchMrts();

    //click sign_in_btn -> window.popup-> popup.innerHTML -> 表格 fetch post /api/sign_in -> ///token or + logout button 
    //                                                       sign_up_btn -> window.popup-> popup.innerHTML
    
    const navAuthBtn = document.getElementById('nav-auth-btn');
    const authPopup = document.getElementById('auth-popup');
    const authOverlay = document.getElementById('auth-overlay'); // 遮罩

    const signInTemplate = `
      <div class="auth-popup">
        <h2>登入會員帳號</h2>
        <form id="signin-form">
          <input type="email" name="email" placeholder="輸入電子信箱" required>
          <input type="password" name="password" placeholder="輸入密碼" required>
          <button type="submit">登入帳戶</button>
        </form>
        <div id="auth-message" style="text-align: center; margin-top: 10px; color: red;"></div>
        <p class="switch-form-text" id="go-to-signup" style="cursor: pointer;">還沒有帳戶?點此註冊</p>
      </div>
    `;

    const signUpTemplate = `
      <div class="auth-popup">
        <h2>註冊會員帳號</h2>
        <form id="signup-form">
          <input type="text" name="name" placeholder="輸入姓名" required>
          <input type="email" name="email" placeholder="輸入電子郵件" required>
          <input type="password" name="password" placeholder="輸入密碼" required>
          <button type="submit">註冊新帳戶</button>
        </form>
        <div id="auth-message" style="text-align: center; margin-top: 10px;"></div>
        <p class="switch-form-text" id="go-to-signin" style="cursor: pointer;">已經有帳戶了?點此登入</p>
      </div>
    `;

    function openPopup() {
      authPopup.style.display = 'block';
      if (authOverlay) authOverlay.style.display = 'block';
      renderSignIn();
    }

    function closePopup() {
      authPopup.style.display = 'none';
      if (authOverlay) authOverlay.style.display = 'none';
      authPopup.innerHTML = ''; 
    }

    function renderSignIn() {
      authPopup.innerHTML = signInTemplate;
      
      document.getElementById('go-to-signup').addEventListener('click', renderSignUp);
      document.getElementById('signin-form').addEventListener('submit', handleSignIn);
    }

    function renderSignUp() {
      authPopup.innerHTML = signUpTemplate;
      
      document.getElementById('go-to-signin').addEventListener('click', renderSignIn);
      document.getElementById('signup-form').addEventListener('submit', handleSignUp);
    }

    async function handleSignIn(event) {
      event.preventDefault();
      const form = event.target;
      const email = form.email.value;
      const password = form.password.value;
      const msgBox = document.getElementById('auth-message');

      try {
        const response = await fetch('/api/sign_in', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ email, password })
        });
        const result = await response.json();

        if (response.ok && result.token) {
          localStorage.setItem('token', result.token);
          window.location.reload();
        } else {
        msgBox.style.color = 'red';
        msgBox.textContent = result.message;
        }
      } catch (error) {
        console.error('登入發生錯誤:', error);
      }
    }

    async function handleSignUp(event) {
      event.preventDefault();
      const form = event.target;
      const name = form.name.value;
      const email = form.email.value;
      const password = form.password.value;
      const msgBox = document.getElementById('auth-message');

      try {
        const response = await fetch('/api/sign_up', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ name, email, password })
        });
        const result = await response.json();

        if (response.ok && result.ok) {
          //alert('註冊成功！請重新登入。');
          //renderSignIn();
          msgBox.style.color = 'green';
          msgBox.textContent = '註冊成功！請重新登入。';
        } else {
          msgBox.style.color = 'red';
          msgBox.textContent = result.message;
        }
      } catch (error) {
        console.error('註冊發生錯誤:', error);
      }
    }

    async function handleSignOut() {
      localStorage.removeItem('token');
      window.location.reload();
    }

    async function checkAuthStatus() {
      const token = localStorage.getItem('token');
      
      if (!token) {
        navAuthBtn.textContent = '登入/註冊';
        navAuthBtn.onclick = openPopup;
        return;
      }

      try {
        const response = await fetch('/api/auth', {
          method: 'GET',
          headers: {
            'Authorization': `Bearer ${token}`
          }
        });
        const result = await response.json();

        if (result.data) {
          navAuthBtn.textContent = '登出系統';
          navAuthBtn.onclick = handleSignOut;
        } else {
          localStorage.removeItem('token');
          navAuthBtn.textContent = '登入/註冊';
          navAuthBtn.onclick = openPopup;
        }
      } catch (error) {
        console.error('驗證狀態錯誤:', error);
        localStorage.removeItem('token');
        navAuthBtn.textContent = '登入/註冊';
        navAuthBtn.onclick = openPopup;
      }
    }

    window.addEventListener('click', (event) => {
      if (event.target === authOverlay) {
        closePopup();
      }
    });
    checkAuthStatus();

  </script>
</body>
</html>
