<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>台北一日遊</title>
  <link rel="stylesheet" href="/static/style.css">
  <script src="https://js.tappaysdk.com/sdk/tpdirect/v5.1.0"></script>
</head>
<body>

  <!-- <nav class="navbar">
    <div class="navbar-section">
      <a href="/" class="logo">台北一日遊</a>
      <ul class="navbar-links" id="nav-links">
        </ul>
    </div>
  </nav> -->
  
  <main class="booking-main" id="booking-main" style="display: none;">
    <section class="headline-section">
      <h2 class="headline">您好，<span id="user-name"></span>，待預訂的行程如下：</h2>
    </section>
    
    <div id="booking-content">
      <section class="booking-info">
        <div class="booking-image">
          <img id="book-img" src="" alt="Attraction Image">
        </div>
        <div class="booking-details">
          <h3 id="book-name">台北一日遊：載入中...</h3>
          <p><strong>日期：</strong><span id="book-date"></span></p>
          <p><strong>時間：</strong><span id="book-time"></span></p>
          <p><strong>費用：</strong><span id="book-price"></span></p>
          <p><strong>地點：</strong><span id="book-address"></span></p>
          <button class="delete-icon" id="delete-btn" aria-label="刪除行程">🗑️</button> 
        </div>
      </section>

      <hr class="divider">

      <section class="contact-info form-section">
        <h3>您的聯絡資訊</h3>
        <div class="form-group">
          <label for="contact-name">聯絡姓名：</label>
          <input type="text" id="contact-name" required>
        </div>
        <div class="form-group">
          <label for="contact-email">連絡信箱：</label>
          <input type="email" id="contact-email" required>
        </div>
        <div class="form-group">
          <label for="contact-phone">手機號碼：</label>
          <input type="tel" id="contact-phone" required>
        </div>
        <p class="notice">請保持手機暢通，準時到達，導覽人員將用手機與您聯繫，務必留下正確的聯絡方式。</p>
      </section>

      <hr class="divider">

      <section class="payment-info form-section">
        <h3>信用卡付款資訊</h3>
        <div class="form-group">
          <label>卡片號碼：</label>
          <div class="tpfield" id="card-number"></div>
        </div>
        <div class="form-group">
          <label>過期時間：</label>
          <div class="tpfield" id="card-expiration-date"></div>
        </div>
        <div class="form-group">
          <label>驗證密碼：</label>
          <div class="tpfield" id="card-ccv"></div>
        </div>
      </section>

      <hr class="divider">
      
      <section class="confirm-section">
        <p class="total-price-text">總價：新台幣 <span id="total-price"></span> 元</p>
        <button id="confirm-btn" class="booking-submit-btn">確認訂購並付款</button>
      </section>
    </div>
    
    <div id="no-booking" style="display: none; text-align: center; padding: 50px 0;">
      <p>目前沒有任何待預訂的行程</p>
    </div>
  </main>

  <footer class="site-footer">
    <p>COPYRIGHT 2021 台北一日遊</p>
  </footer>

  <script src="/static/nav.js"></script>

  <script>
    document.addEventListener("DOMContentLoaded", async () => {
      let currentBookingData = null; 

      TPDirect.setupSDK(171124, 'app_2zwMPTmGmJIq9dmZTd9YLzWXAsESbpa07v2xtQUn4EIFudd36yu2IQuplXYK', 'sandbox');
      TPDirect.card.setup({
      fields: {
          number: { element: '#card-number', placeholder: '**** **** **** ****' },
          expirationDate: { element: '#card-expiration-date', placeholder: 'MM / YY' },
          ccv: { element: '#card-ccv', placeholder: 'CCV' }
      },
      styles: { 
          'input': { 'color': 'gray' },
          'input.ccv': { 'font-size': '16px' },
          'input.expiration-date': { 'font-size': '16px' },
          'input.number': { 'font-size': '16px' }
      }
      });   
      
      const token = localStorage.getItem("token");
      if (!token) {
        window.location.href = "/";
        return;
      }

      try {
        const authRes = await fetch("/api/auth", {
          headers: { "Authorization": `Bearer ${token}` }
        });
        const authResult = await authRes.json();
        
        if (!authResult.data) {
          window.location.href = "/";
          return;
        }
        
        document.getElementById("user-name").textContent = authResult.data.name;
        document.getElementById("contact-name").value = authResult.data.name;
        document.getElementById("contact-email").value = authResult.data.email;
        
        document.getElementById("booking-main").style.display = "block";
        
      } catch (error) {
        console.error("Auth Error:", error);
        window.location.href = "/";
        return;
      }

      try {
        const bookingRes = await fetch("/api/booking", {
          headers: { "Authorization": `Bearer ${token}` }
        });
        const bookingResult = await bookingRes.json();

        if (bookingResult.data) {
          const data = bookingResult.data;

          currentBookingData = data;
          
          document.getElementById("book-img").src = data.attraction.image;
          document.getElementById("book-name").textContent = `台北一日遊：${data.attraction.name}`;
          document.getElementById("book-date").textContent = data.date;
          
          const timeText = data.time === "morning" ? "早上 9 點到下午 2 點" : "下午 2 點到晚上 7 點";
          document.getElementById("book-time").textContent = timeText;
          
          document.getElementById("book-price").textContent = `新台幣 ${data.price} 元`;
          document.getElementById("book-address").textContent = data.attraction.address;
          document.getElementById("total-price").textContent = data.price;
          
        } else {
          document.getElementById("booking-content").style.display = "none";
          document.getElementById("no-booking").style.display = "block";
        }
      } catch (error) {
        console.error("Fetch Booking Error:", error);
      }

      const deleteBtn = document.getElementById("delete-btn");
      if (deleteBtn) {
        deleteBtn.addEventListener("click", async () => {
          try {
            const delRes = await fetch("/api/booking", {
              method: "DELETE",
              headers: { "Authorization": `Bearer ${token}` }
            });
            const delResult = await delRes.json();
            
            if (delResult.ok) {
              window.location.reload();
            }
          } catch (error) {
            console.error("Delete Booking Error:", error);
          }
        });
      }

    document.getElementById("confirm-btn").addEventListener("click", () => {
      const tappayStatus = TPDirect.card.getTappayFieldsStatus();
      if (tappayStatus.canGetPrime === false) {
          alert('信用卡資訊填寫錯誤');
          return;
      }

      TPDirect.card.getPrime(async (result) => {
        if (result.status !== 0) {
            alert('取得 Prime 失敗');
            return;
        }
        
        const prime = result.card.prime;
        const contactName = document.getElementById("contact-name").value;
        const contactEmail = document.getElementById("contact-email").value;
        const contactPhone = document.getElementById("contact-phone").value;

        if (!contactName || !contactEmail || !contactPhone) {
            alert("請完整填寫聯絡資訊");
            return;
        }

        const requestBody = {
            prime: prime,
            order: {
                price: currentBookingData.price,
                trip: {
                    attraction: currentBookingData.attraction,
                    date: currentBookingData.date,
                    time: currentBookingData.time
                },
                contact: {
                    name: contactName,
                    email: contactEmail,
                    phone: contactPhone
                }
            }
        };

        try {
            const token = localStorage.getItem("token");
            const response = await fetch("/api/orders", {
                method: "POST",
                headers: {
                    "Content-Type": "application/json",
                    "Authorization": `Bearer ${token}`
                },
                body: JSON.stringify(requestBody)
            });
            
            const orderResult = await response.json();
            if (orderResult.data && orderResult.data.number) {
                window.location.href = `/thankyou?number=${orderResult.data.number}`;
            } else {
                alert(orderResult.message || "訂單建立失敗");
            }
        } catch (error) {
            console.error("Order Submit Error:", error);
        }
      });
  });
});
  </script>
</body>
</html>
