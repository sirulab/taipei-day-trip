<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>台北一日遊</title>
  <link rel="stylesheet" href="/static/style.css">
</head>
<body>
  <!--相同的部分要怎麼處理-->

    <div class="navbar-section">
      <a href="/" class="logo">台北一日遊</a>
      <ul class="navbar-links">
        <a href="#">預定行程</a>
        <a href="#">登入/註冊</a>
      </ul>
    </div>
  </nav> -->

  <main class="attraction-main">
    <section class="attraction-top">
      <div class="slideshow-container" id="slideshow">
        <div class="slides-wrapper" id="slides-wrapper"></div>
        <button class="slide-btn prev-btn" id="prev-btn">‹</button>
        <button class="slide-btn next-btn" id="next-btn">›</button>
        <div class="indicators-container" id="indicators-container"></div>
      </div>

      <div class="booking-panel">
        <h1 id="attr-name" class="attr-name">載入中...</h1>
        <p id="attr-cat-mrt" class="attr-cat-mrt"></p>
        <div class="booking-form">
          <h3>訂購導覽行程</h3>
          <p>以此景點為中心的一日行程，帶您探索城市角落故事</p>
          <div class="form-row">
            <label>選擇日期：</label>
            <input type="date" id="booking-date">
          </div>
          <div class="form-row time-options">
            <label>選擇時間：</label>
            <input type="radio" name="time" id="time-morning" value="morning" checked>
            <label for="time-morning" class="radio-label">上半天</label>
            <input type="radio" name="time" id="time-afternoon" value="afternoon">
            <label for="time-afternoon" class="radio-label">下半天</label>
          </div>
          <div class="form-row">
            <label>導覽費用：</label>
            <span id="booking-price">新台幣 2000 元</span>
          </div>
          <button class="booking-submit-btn">開始預約行程</button>
        </div>
      </div>
    </section>
    
    <hr class="divider">
    
    <section class="attraction-bottom">
      <p id="attr-desc" class="attr-desc"></p>
      <h4>景點地址：</h4>
      <p id="attr-address"></p>
      <h4>交通方式：</h4>
      <p id="attr-transport"></p>
    </section>
  </main>

  <footer class="site-footer">
    <p>COPYRIGHT 2021 台北一日遊</p>
  </footer>

  <script src="/static/nav.js"></script>

  <script>
    document.addEventListener("DOMContentLoaded", () => {
    const pathname = window.location.pathname;
    const attractionId = pathname.split('/').pop();

    const attrName = document.getElementById('attr-name');
    const attrCatMrt = document.getElementById('attr-cat-mrt');
    const attrDesc = document.getElementById('attr-desc');
    const attrAddress = document.getElementById('attr-address');
    const attrTransport = document.getElementById('attr-transport');
  
    fetch(`/api/attraction/${attractionId}`)
      .then(res => res.json())
      .then(result => {
        const data = result.data;
        if(!data) return;
        
        attrName.textContent = data.name;
        attrCatMrt.textContent = `${data.category} at ${data.mrt}`;
        attrDesc.textContent = data.description;
        attrAddress.textContent = data.address;
        attrTransport.textContent = data.transport;

        initSlideshow(data.images);
      })
      .catch(err => console.error("API Fetch Error:", err));

      const morningRadio = document.getElementById('time-morning');
      const afternoonRadio = document.getElementById('time-afternoon');
      const priceDisplay = document.getElementById('booking-price');

      morningRadio.addEventListener('change', () => priceDisplay.textContent = '新台幣 2000 元');
      afternoonRadio.addEventListener('change', () => priceDisplay.textContent = '新台幣 2500 元');

    function initSlideshow(images) {
    if(!images || images.length === 0) return;
    
    const wrapper = document.getElementById('slides-wrapper');
    const indicatorsContainer = document.getElementById('indicators-container');
    let currentIndex = 0;

    images.forEach((imgUrl, index) => {
      const img = document.createElement('img');
      img.src = imgUrl;
      wrapper.appendChild(img);

      const indicator = document.createElement('div');
      indicator.className = `indicator ${index === 0 ? 'active' : ''}`;
      indicator.addEventListener('click', () => goToSlide(index));
      indicatorsContainer.appendChild(indicator);
    });

    const indicators = document.querySelectorAll('.indicator');

    function goToSlide(index) {
      if (index < 0) index = images.length - 1;
      if (index >= images.length) index = 0;
      
      currentIndex = index;
      wrapper.style.transform = `translateX(-${currentIndex * 100}%)`;
      
      indicators.forEach(d => d.classList.remove('active'));
      indicators[currentIndex].classList.add('active');
    }

    document.getElementById('prev-btn').addEventListener('click', () => goToSlide(currentIndex - 1));
    document.getElementById('next-btn').addEventListener('click', () => goToSlide(currentIndex + 1));
    }

    const submitBtn = document.querySelector('.booking-submit-btn');
    submitBtn.addEventListener('click', async () => {
      const token = localStorage.getItem("token");
      if (!token) {
        //document.getElementById('nav-auth-btn').click();
        if (typeof window.openAuthPopup === 'function') {
            window.openAuthPopup();
        }
        return;
      }

      const dateInput = document.getElementById('booking-date').value;
      if (!dateInput) {
        alert("請選擇日期");
        return;
      }

      const timeInput = document.querySelector('input[name="time"]:checked').value;
      const price = timeInput === "morning" ? 2000 : 2500;

      try {
        const response = await fetch("/api/booking", {
          method: "POST",
          headers: {
            "Content-Type": "application/json",
            "Authorization": `Bearer ${token}`
          },
          body: JSON.stringify({
            attractionId: parseInt(attractionId), // 現在這裡抓得到 attractionId 了！
            date: dateInput,
            time: timeInput,
            price: price
          })
        });
        
        const result = await response.json();
        if (result.ok) {
          window.location.href = "/booking";
        } else {
          alert(result.message);
        }
      } catch (error) {
        console.error("Booking Error:", error);
      }
    });
    // 預約按鈕

}); // DOMContentLoaded
  </script>
</body>
</html>
